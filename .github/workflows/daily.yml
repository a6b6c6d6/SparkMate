name: SparkMate Daily

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. 01:00 UTC is 09:00 in Asia/Shanghai.
    - cron: "0 1 * * *"

permissions:
  contents: read

concurrency:
  group: sparkmate-daily
  cancel-in-progress: false

jobs:
  send:
    name: Send scheduled messages
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      HEADLESS: "1"
      TASKS: >-
        [{"unique_id":"USER1","username":"GitHub Actions","targets":[]}]
      COOKIES_USER1: ${{ secrets.DOUYIN_COOKIES_USER1 }}
      TASKS_JSON: ${{ secrets.SPARKMATE_TASKS_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install chromium --with-deps

      - name: Validate Secrets and create tasks.json
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          cookies_raw = os.environ.get("COOKIES_USER1", "").strip()
          tasks_raw = os.environ.get("TASKS_JSON", "").strip()
          if not cookies_raw:
              raise SystemExit("Missing GitHub Secret: DOUYIN_COOKIES_USER1")
          if not tasks_raw:
              raise SystemExit("Missing GitHub Secret: SPARKMATE_TASKS_JSON")

          cookies = json.loads(cookies_raw)
          tasks = json.loads(tasks_raw)
          if not isinstance(cookies, list) or not cookies:
              raise SystemExit("DOUYIN_COOKIES_USER1 must be a non-empty JSON array")
          if not isinstance(tasks, dict) or not isinstance(tasks.get("tasks"), list):
              raise SystemExit("SPARKMATE_TASKS_JSON must contain a tasks array")
          if not tasks["tasks"]:
              raise SystemExit("SPARKMATE_TASKS_JSON contains no tasks")

          Path("tasks.json").write_text(
              json.dumps(tasks, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(
              f"Validated {len(cookies)} cookies and "
              f"{len(tasks['tasks'])} tasks"
          )

      - name: Run SparkMate
        shell: bash
        run: |
          set -o pipefail
          python run_tasks.py 2>&1 | tee run_tasks.log

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparkmate-run-${{ github.run_number }}
          path: run_tasks.log
          if-no-files-found: ignore
          retention-days: 7
